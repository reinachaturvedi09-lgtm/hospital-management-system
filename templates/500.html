{% extends "base.html" %}
{% block title %}500 - Server Error - HMS{% endblock %}

{% block fullpage_content %}
<div class="d-flex align-items-center justify-content-center min-vh-100">
    <div class="text-center">
        <h1 class="display-1 text-danger fw-bold">500</h1>
        <h3 class="mb-3">Internal Server Error</h3>
        <p class="text-muted mb-4">Something went wrong on our end. Please try again later.</p>
        <a href="{{ url_for('auth.login') }}" class="btn btn-primary">
            <i class="bi bi-house me-1"></i> Go to Home
        </a>
    </div>
</div>
{% endblock %}
